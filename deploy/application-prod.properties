# ESP 层冷辊道监控系统 - 生产环境配置
server.port=8080
server.servlet.context-path=/

# API 配置
esp.api.url=https://iip.rizhaosteel.com/di-api/dacoo-api/openApi/exDataManage/samplingQuery?appKey=240622160158015900001
esp.api.timeout=5000

# CSV 文件路径
esp.csv.path=/opt/esp-layer-cooling/data/meter_ledger.csv

# 电流报警阈值 (安培)
esp.current.threshold=6.0

# CORS 允许的来源 (多个用逗号分隔)
esp.cors.allowed-origins=http://localhost,http://localhost:8080,http://10.51.190.77

# 日志配置
logging.file.path=/opt/esp-layer-cooling/logs
logging.level.root=INFO
logging.level.com.rizhao.esp=INFO
