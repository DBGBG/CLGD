# ==========================================
# ESP 层冷辊道监控系统 - Java 后端配置
# ==========================================

# 服务端口
server.port=8080

# 服务名称
spring.application.name=esp-layer-cooling

# ==========================================
# 外部 API 配置
# ==========================================
# 日照钢铁数据采集 API
esp.api.url=https://iiptest.rizhaosteel.com/di-api/dacoo-api/openApi/exDataManage/samplingQuery?appKey=240622160158015900001

# ==========================================
# CSV 文件配置
# ==========================================
esp.csv.path=../meter_ledger.csv

# 当前电流阈值（超过此值视为异常，单位：A）
esp.current.threshold=6.0

# CORS 配置（允许前端访问）
esp.cors.allowed-origins=http://localhost:3000

# 日志配置
logging.level.com.rizhao.esp=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
